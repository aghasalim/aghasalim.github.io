name: refresh heatmap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rebuild the heatmap from both accounts
        run: python3 .github/heatmap.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh contribution heatmap"
          git push

      - name: deploy to Vercel
        run: npx --yes vercel@52.0.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_2lTaHEHXAyiZAlLJ9YEvLK3d
          VERCEL_PROJECT_ID: prj_fDtbLi1VYrwSjo4TkiJwEM85lf2U
