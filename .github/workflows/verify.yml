name: verify claims

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: install R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base > /dev/null

      - name: recompute
        run: bash verify/verify.sh

      - name: the checks must reject a corrupted ledger
        run: |
          cp verify/claims.tsv /tmp/claims.tsv.bak
          python3 -c "
          lines = open('verify/claims.tsv').readlines()
          f = lines[1].split('\t')
          f[6] = '999.9'
          lines[1] = '\t'.join(f)
          open('verify/claims.tsv', 'w').writelines(lines)
          "
          if bash verify/verify.sh 2>/dev/null; then
            echo "the corrupted ledger was accepted"
            cp /tmp/claims.tsv.bak verify/claims.tsv
            exit 1
          fi
          echo "rejected as it should be"
          cp /tmp/claims.tsv.bak verify/claims.tsv
          bash verify/verify.sh

      - name: a published value that is not in its phrase is rejected
        run: |
          cp verify/claims.tsv /tmp/claims.tsv.bak
          python3 -c "
          s = open('verify/claims.tsv').read()
          t = s.replace('copy\t5.3\t-\t5.3\t', 'copy\t5.4\t-\t5.4\t', 1)
          assert t != s
          open('verify/claims.tsv', 'w').write(t)
          "
          if node verify/claims.js; then
            echo "claims.js accepted 5.4 for a phrase that says 5.3"
            cp /tmp/claims.tsv.bak verify/claims.tsv
            exit 1
          fi
          cp /tmp/claims.tsv.bak verify/claims.tsv
